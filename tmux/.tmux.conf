# set true color
set-option -sa terminal-overrides ",xterm*:Tc"

set -g mouse on

# set prefix
# unbind C-b
# set -g prefix C-space
# bind C-Space send-prefix

# shift + alt to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# start window/panes numbering at 1 not 0
set -g base-index 1
set -g pane-base-index 1
set -g clock-mode-style 12
set -g status-right "%I:%M"
set-window-option -g pane-base-index 1
set-window-option -g mode-keys vi
set-option -g renumber-windows on

# open panes in current directory
unbind '"'
unbind '%'
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

bind g run "~/.dotfiles/misc/open-github.sh"

# custom theme
set -g status-justify absolute-centre
set -g status-style 'fg=color8 bg=default'
set -g status-right ' %m/%d  %I:%M  '
set -g status-left '  #S'
set -g status-left-length 100
setw -g window-status-current-style 'fg=color4 bg=default bold'
setw -g window-status-current-format '#I:#W'
setw -g window-status-style 'fg=color8 dim'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'
